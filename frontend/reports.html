<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานสรุปผล | Pormormovi3</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .report-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--nav-active-bg);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-muted);
            transition: var(--transition);
            border-radius: 12px;
        }
        .tab-btn.active {
            color: var(--primary-dark);
            background: var(--nav-active-bg);
        }
        .best-seller-badge {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="report-tabs">
                <button class="tab-btn active" data-period="daily">รายวัน</button>
                <button class="tab-btn" data-period="weekly">รายสัปดาห์</button>
                <button class="tab-btn" data-period="monthly">รายเดือน</button>
                <button class="tab-btn" data-period="yearly">รายปี</button>
            </div>

            <!-- Summary Cards -->
            <div class="stats-grid">
                <div class="card stat-card fade-in">
                    <p class="stat-label">รายรับทั้งหมด</p>
                    <p class="stat-value" id="rep-revenue">฿0.00</p>
                </div>
                <div class="card stat-card fade-in" style="animation-delay: 0.1s;">
                    <p class="stat-label">ต้นทุนรวม</p>
                    <p class="stat-value" id="rep-cost">฿0.00</p>
                </div>
                <div class="card stat-card fade-in" style="animation-delay: 0.2s;">
                    <p class="stat-label">กำไรสุทธิ</p>
                    <p class="stat-value" id="rep-profit" style="color: var(--primary-dark);">฿0.00</p>
                </div>
                <div class="card stat-card fade-in" style="animation-delay: 0.3s;">
                    <p class="stat-label">แอปขายดีที่สุด</p>
                    <p class="stat-value" id="rep-best-app" style="font-size: 1.2rem;">-</p>
                </div>
            </div>

            <div class="card fade-in" style="animation-delay: 0.4s;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h4 style="display: flex; align-items: center; gap: 10px;">
                        <span style="width: 24px;">${Icons.star}</span>
                        สรุปยอดแยกตามแอปพลิเคชัน
                    </h4>
                    <button id="export-csv" class="btn btn-secondary" style="padding: 8px 16px; font-size: 0.8rem;">
                        Export to CSV
                    </button>
                </div>

                <div class="table-responsive">
                    <table id="report-table">
                        <thead>
                            <tr>
                                <th>ชื่อแอป</th>
                                <th>จำนวนรายการ</th>
                                <th>จำนวนชิ้น (Qty)</th>
                                <th>รายได้รวม</th>
                                <th>ต้นทุนรวม</th>
                                <th>กำไรรวม</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/icons.js"></script>
    <script src="assets/js/theme-engine.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components.js"></script>
    <script>
        let currentPeriod = 'daily';
        
        document.addEventListener('DOMContentLoaded', async () => {
            await Auth.checkSession();
            Components.injectLayout();
            setupTabs();
            await loadReport();
            document.getElementById('export-csv').onclick = exportToCSV;
        });

        function setupTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.onclick = async () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentPeriod = tab.dataset.period;
                    await loadReport();
                };
            });
        }

        async function loadReport() {
            try {
                const txs = await api.get('/transactions');
                const now = new Date();
                const filtered = txs.filter(t => {
                    const d = new Date(t.date);
                    if (currentPeriod === 'daily') return d.toDateString() === now.toDateString();
                    if (currentPeriod === 'weekly') { const weekAgo = new Date(); weekAgo.setDate(now.getDate() - 7); return d >= weekAgo; }
                    if (currentPeriod === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    if (currentPeriod === 'yearly') return d.getFullYear() === now.getFullYear();
                    return true;
                });

                const groups = {};
                let totalRev = 0, totalCost = 0, totalProfit = 0;

                filtered.forEach(t => {
                    if (!groups[t.app_name]) groups[t.app_name] = { count: 0, qty: 0, revenue: 0, cost: 0, profit: 0 };
                    const g = groups[t.app_name];
                    g.count++;
                    if (t.category === 'subscription_sale') {
                        const rev = t.selling_price * t.quantity;
                        const cost = t.cost_price * t.quantity;
                        g.qty += t.quantity; g.revenue += rev; g.cost += cost; g.profit += t.profit;
                        totalRev += rev; totalCost += cost; totalProfit += t.profit;
                    } else if (t.category === 'expense') {
                        const cost = t.cost_price * t.quantity;
                        g.cost += cost; g.profit -= cost;
                        totalCost += cost; totalProfit -= cost;
                    } else if (t.category === 'refund') {
                        const rev = t.selling_price * t.quantity;
                        g.revenue -= rev; g.profit -= t.profit;
                        totalRev -= rev; totalProfit -= t.profit;
                    }
                });

                document.getElementById('rep-revenue').textContent = Utils.formatCurrency(totalRev);
                document.getElementById('rep-cost').textContent = Utils.formatCurrency(totalCost);
                document.getElementById('rep-profit').textContent = Utils.formatCurrency(totalProfit);

                const sortedApps = Object.entries(groups).sort((a, b) => b[1].revenue - a[1].revenue);
                document.getElementById('rep-best-app').textContent = sortedApps[0] ? sortedApps[0][0] : '-';

                const tbody = document.querySelector('#report-table tbody');
                if (sortedApps.length === 0) {
                    const icon = ThemeEngine.getCurrent() === 'kuromi' ? Icons.kuromi : Icons.melody;
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 4rem; color: var(--text-muted);"><div style="width: 60px; margin: 0 auto 1.5rem; opacity: 0.2;">${icon}</div>ไม่พบข้อมูลในช่วงเวลานี้</td></tr>`;
                } else {
                    tbody.innerHTML = sortedApps.map(([name, g], index) => `
                        <tr>
                            <td style="font-weight: 700;">${index === 0 ? '<span class="best-seller-badge">BEST SELLER</span> ' : ''}${name}</td>
                            <td>${g.count}</td>
                            <td>${g.qty}</td>
                            <td>${Utils.formatCurrency(g.revenue)}</td>
                            <td>${Utils.formatCurrency(g.cost)}</td>
                            <td style="font-weight: 800; color: ${g.profit >= 0 ? 'var(--success)' : 'var(--error)'};">${Utils.formatCurrency(g.profit)}</td>
                        </tr>`).join('');
                }
            } catch (err) {
                console.error('Failed to load report:', err);
            }
        }

        function exportToCSV() {
            const table = document.getElementById('report-table');
            let csv = [];
            const rows = table.querySelectorAll('tr');
            for (let i = 0; i < rows.length; i++) {
                const row = [], cols = rows[i].querySelectorAll('td, th');
                for (let j = 0; j < cols.length; j++) {
                    let text = cols[j].innerText.replace('BEST SELLER ', '').replace('฿', '').replace(/,/g, '');
                    row.push('"' + text + '"');
                }
                csv.push(row.join(','));
            }
            const csvContent = "\uFEFF" + csv.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `report_${currentPeriod}_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
